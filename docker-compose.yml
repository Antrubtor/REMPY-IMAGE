services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rempy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d rempy -h 127.0.0.1" ]
      interval: 5s
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - UV_NO_DEV=0
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rempy
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build: ./frontend
    ports:
      - "8050:8050"
    environment:
      - UV_NO_DEV=0
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./frontend/uv.lock

volumes:
  postgres_data: